name: Lotto Telegram Analyzer

on:
  schedule:
    # 매주 월요일 오후 6시 (KST 기준 09:00 UTC)에만 1회 실행
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  run-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Lotto Analyzer
        env:
          LOTTO_TELEGRAM_TOKEN: ${{ secrets.LOTTO_TELEGRAM_TOKEN }}
          LOTTO_TELEGRAM_CHAT_ID: ${{ secrets.LOTTO_TELEGRAM_CHAT_ID }}
        run: python lotto.py  # 실행하시는 메인 파이썬 파일명으로 확인해주세요
