name: Lotto Telegram Analyzer

on:
  schedule:
    # 월요일 오후 6시 KST (UTC 09:00 Mon) - 스마트 통계 분석 리포트
    - cron: '0 9 * * 1'
    # 금요일 오후 6시 KST (UTC 09:00 Fri) - 추천 번호 조합 10선
    - cron: '0 9 * * 5'
    # 일요일 오후 1시 KST (UTC 04:00 Sun) - 당첨 결과 & 전적 통계
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드 (비우면 요일 자동 판단)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - monday
          - friday
          - sunday

permissions:
  contents: write

concurrency:
  group: lotto
  cancel-in-progress: false

jobs:
  run-lotto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Lotto Notifier
        env:
          LOTTO_TELEGRAM_TOKEN: ${{ secrets.LOTTO_TELEGRAM_TOKEN }}
          LOTTO_TELEGRAM_CHAT_ID: ${{ secrets.LOTTO_TELEGRAM_CHAT_ID }}
          LOTTO_MODE: ${{ github.event.inputs.mode }}
        run: python lotto.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update lotto data and reports"
            git push
          fi
